<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutor IA para Design Imersivo</title>
<meta name="description" content="Percurso de 14 sessões em que futuros professores desenham ambientes imersivos com um tutor IA como copiloto. Versão em português e inglês.">
<meta name="theme-color" content="#F3F4FA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236D4BFF'/%3E%3Cstop offset='.5' stop-color='%23FF7438'/%3E%3Cstop offset='1' stop-color='%231A97EC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: sticky top bar under a spectrum stripe; content column up to 1180px; sessions = 290px index + reading column of ~720px.
     The seven-colour spectrum is the pathway itself: one hue per phase, from kick-off (violet) to validation (blue). */
  --bg:#F3F4FA;
  --surface:#FFFFFF;
  --ink:#161B33;
  --muted:#565D77;
  --line:#DEE1EE;
  --accent:#5233E8;
  --tint:rgba(82,51,232,.07);
  --good:#0D7A55;
  --bad:#B4372E;
  --cta-a:#5233E8;
  --cta-b:#B12F74;
  --p1:#6D4BFF;--p2:#E0458A;--p3:#FF7438;--p4:#E3A008;--p5:#10B384;--p6:#1A97EC;--p7:#4859F2;
  --spectrum:linear-gradient(90deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7));
  --spectrum-v:linear-gradient(180deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7));
  --mesh-a:34%;--mesh-b:26%;
  --shadow:0 1px 2px rgba(22,27,51,.05),0 14px 34px -18px rgba(22,27,51,.28);
  --font-display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --t-xs:.8125rem;--t-sm:.9375rem;--t-base:1.0625rem;--t-md:1.25rem;--t-lg:1.625rem;--t-xl:2.125rem;
  --r-lg:22px;--r:14px;--r-sm:10px;
  --bar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1020;--surface:#161A31;--ink:#ECEEFA;--muted:#A3A9C6;--line:#272C49;
    --accent:#A797FF;--tint:rgba(167,151,255,.10);--good:#4FD1A0;--bad:#FF8A80;
    --cta-a:#6247FF;--cta-b:#C2367F;
    --p1:#8C73FF;--p2:#F062A0;--p3:#FF8A55;--p4:#F5B829;--p5:#2CCB9A;--p6:#3AAEF5;--p7:#6E7DFF;
    --mesh-a:24%;--mesh-b:18%;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1020;--surface:#161A31;--ink:#ECEEFA;--muted:#A3A9C6;--line:#272C49;
  --accent:#A797FF;--tint:rgba(167,151,255,.10);--good:#4FD1A0;--bad:#FF8A80;
  --cta-a:#6247FF;--cta-b:#C2367F;
  --p1:#8C73FF;--p2:#F062A0;--p3:#FF8A55;--p4:#F5B829;--p5:#2CCB9A;--p6:#3AAEF5;--p7:#6E7DFF;
  --mesh-a:24%;--mesh-b:18%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--t-base);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;line-height:1.18;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
h1:focus,h2:focus{outline:none}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:700}
.skip:focus{top:12px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--spectrum)}
.topbar-inner{height:var(--bar-h);display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:500;font-size:.95rem;letter-spacing:-.01em;white-space:nowrap}
.lens{flex:none;width:28px;height:28px;border-radius:50%;background:conic-gradient(from 210deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7),var(--p1));position:relative;box-shadow:0 4px 14px -6px color-mix(in srgb,var(--p1) 70%,transparent)}
.lens::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.lens.sm{width:22px;height:22px}.lens.sm::after{inset:7px}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{display:inline-flex;align-items:center;padding:8px 13px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:var(--t-sm);font-weight:700;transition:color .15s,background-color .15s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line);flex:none}
.lang button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:700;font-size:var(--t-xs);color:var(--muted);cursor:pointer;min-width:42px;transition:background-color .15s,color .15s}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Bottom tab bar (phones) */
.tabbar{display:none}
@media (max-width:860px){
  .nav{display:none}
  .lang{margin-left:auto}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:700;position:relative}
  .tabbar svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--ink);background:var(--tint)}
  .tabbar a[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:3px;background:var(--spectrum)}
}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Buttons and small parts */
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font-weight:700;font-size:var(--t-sm);text-decoration:none;border:0;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn-primary{background:linear-gradient(100deg,var(--cta-a),var(--cta-b));color:#fff;box-shadow:0 10px 24px -12px color-mix(in srgb,var(--cta-a) 80%,transparent)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 28px -12px color-mix(in srgb,var(--cta-b) 80%,transparent)}
.btn-ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 10px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 13%,var(--surface));color:var(--ink);font-size:var(--t-xs);font-weight:700;white-space:nowrap}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
.pill{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--t-xs);font-weight:700;color:var(--muted);white-space:nowrap}
.copy{display:inline-flex;align-items:center;gap:6px;margin-left:auto;padding:5px 11px;border-radius:999px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--t-xs);font-weight:700;color:var(--ink);cursor:pointer;transition:box-shadow .15s,background-color .15s}
.copy:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.copy.done{background:color-mix(in srgb,var(--good) 16%,var(--surface));box-shadow:inset 0 0 0 1px var(--good)}
.copy .ico{width:15px;height:15px}

/* Section scaffolding */
.block{padding-top:72px}
.block-head{display:grid;gap:10px;max-width:68ch;margin-bottom:28px}
.block-head h2{font-size:var(--t-lg)}
.lead{color:var(--muted);font-size:var(--t-base)}
.page-head{padding-top:44px;display:grid;gap:14px;max-width:72ch}
.page-head h1{font-size:clamp(1.75rem,3.4vw,2.5rem)}
.page-head p{color:var(--muted);font-size:1.125rem}

/* Hero */
.hero{position:relative;isolation:isolate;overflow:hidden;padding:56px 0 64px}
.hero::before{content:"";position:absolute;inset:-10% -5% -10%;z-index:-1;pointer-events:none;background:
  radial-gradient(38% 55% at 6% 12%,color-mix(in srgb,var(--p1) var(--mesh-a),transparent),transparent 72%),
  radial-gradient(30% 45% at 48% 0%,color-mix(in srgb,var(--p2) var(--mesh-b),transparent),transparent 72%),
  radial-gradient(34% 50% at 96% 22%,color-mix(in srgb,var(--p3) var(--mesh-b),transparent),transparent 72%),
  radial-gradient(40% 55% at 82% 96%,color-mix(in srgb,var(--p5) var(--mesh-b),transparent),transparent 72%),
  radial-gradient(40% 50% at 22% 100%,color-mix(in srgb,var(--p6) var(--mesh-a),transparent),transparent 72%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:56px;align-items:center}
.hero-copy{display:grid;gap:22px}
.hero h1{font-size:clamp(1.9rem,3.9vw,3rem);line-height:1.08;letter-spacing:-.03em}
.hero .lede{font-size:1.1875rem;color:var(--muted);max-width:56ch}
.question{margin:0;position:relative;padding:4px 0 4px 22px;max-width:56ch}
.question::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px;background:var(--spectrum-v)}
.question figcaption{font-size:var(--t-xs);font-weight:700;color:var(--muted);margin-bottom:4px}
.question blockquote{margin:0;font-size:1.125rem;font-style:italic;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:12px}

/* Tutor chat demo */
.chat{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.chat-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.chat-head .who-tutor{display:grid;line-height:1.25}
.chat-head .who-tutor strong{font-size:var(--t-sm)}
.chat-head .who-tutor span{font-size:var(--t-xs);color:var(--muted)}
.chat-head .chip{margin-left:auto}
.chat-body{padding:20px 18px 8px;display:grid;gap:14px;min-height:260px;align-content:start}
.msg{max-width:88%;display:grid;gap:4px}
.msg .who{font-size:.75rem;font-weight:700;color:var(--muted)}
.msg p{padding:12px 15px;border-radius:18px;font-size:var(--t-sm);line-height:1.5}
.msg-user{justify-self:end;text-align:left}
.msg-user .who{justify-self:end}
.msg-user p{background:linear-gradient(110deg,var(--cta-a),var(--cta-b));color:#fff;border-bottom-right-radius:6px}
.msg-tutor p{background:var(--bg);border-bottom-left-radius:6px;box-shadow:inset 0 0 0 1px var(--line)}
.chat.animate .msg{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
.chat.animate .msg-tutor{animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chat-foot{display:flex;align-items:center;gap:12px;padding:12px 18px 16px}
.chat-foot .btn{white-space:nowrap}
.chat-foot .note-sm{font-size:var(--t-xs);color:var(--muted)}
.dots{display:flex;gap:5px;margin-left:auto}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background-color .2s,width .2s}
.dots span.on{width:18px;border-radius:7px;background:var(--spectrum)}
.chat-foot .btn{padding:9px 16px;font-size:var(--t-xs)}

/* Facts */
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin:0}
.fact{background:var(--surface);padding:18px 20px;display:grid;gap:4px;align-content:start}
.fact dt{font-size:var(--t-xs);font-weight:700;color:var(--muted)}
.fact dd{margin:0;font-size:var(--t-base);line-height:1.4}
.fact.wide{grid-column:span 2}

/* Ribbon */
.ribbon{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;list-style:none;margin:0;padding:0}
.seg{display:grid;gap:8px;justify-items:center;text-decoration:none;color:var(--ink);border-radius:12px;padding-top:2px}
.seg .n{font-family:var(--font-display);font-size:var(--t-xs);font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted)}
.seg .bar{width:100%;height:58px;border-radius:12px;background:var(--c);transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s;box-shadow:inset 0 -14px 24px -18px rgba(0,0,0,.35)}
.seg:hover .bar,.seg:focus-visible .bar{transform:translateY(-5px);box-shadow:0 12px 22px -12px var(--c)}
.seg:hover .n{color:var(--ink)}
.ribbon-labels{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;margin-top:12px}
.ribbon-labels span{border-top:3px solid var(--c);padding-top:8px;font-size:var(--t-xs);font-weight:700;line-height:1.3}
.ribbon-labels small{display:block;font-weight:400;color:var(--muted)}
.legend{display:none;list-style:none;margin:16px 0 0;padding:0;gap:8px 18px;grid-template-columns:repeat(2,minmax(0,1fr))}
.legend li{display:flex;align-items:center;gap:8px;font-size:var(--t-sm)}
.legend li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.legend small{color:var(--muted)}

/* Tutor growth timeline */
.grow-cols{display:grid;grid-template-columns:200px 1fr 1fr;gap:16px;padding-left:40px;margin-bottom:10px;font-size:var(--t-xs);font-weight:700;color:var(--muted)}
.grow{list-style:none;margin:0;padding:0;position:relative;display:grid;gap:14px}
.grow::before{content:"";position:absolute;left:12px;top:22px;bottom:22px;width:3px;border-radius:3px;background:var(--spectrum-v)}
.grow-row{display:grid;grid-template-columns:200px 1fr 1fr;gap:16px;padding-left:40px;position:relative}
.grow-phase{display:grid;align-content:center;gap:2px;padding:6px 0}
.grow-phase .node{position:absolute;left:4px;top:50%;margin-top:-10px;width:19px;height:19px;border-radius:50%;background:var(--surface);border:5px solid var(--c)}
.grow-phase strong{font-size:var(--t-base)}
.grow-phase span{font-size:var(--t-xs);color:var(--muted)}
.grow-tutor,.grow-product{border-radius:var(--r);padding:14px 18px;display:grid;gap:6px;align-content:start}
.grow-tutor{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.grow-tutor.is-key{background:color-mix(in srgb,var(--c) 12%,var(--surface));box-shadow:inset 0 0 0 2px var(--c)}
.grow-tutor .ver{font-family:var(--font-display);font-size:.75rem;font-weight:500;color:var(--muted)}
.grow-product{box-shadow:inset 3px 0 0 var(--c);border-radius:0 var(--r) var(--r) 0;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.grow-tutor strong,.grow-product strong{font-size:var(--t-base);line-height:1.35}
.grow ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:var(--t-sm);color:var(--muted)}

/* Framing + objectives */
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:start}
.prose{display:grid;gap:16px;max-width:68ch}
.prose p{font-size:var(--t-base)}
.objs{list-style:none;margin:0;padding:0;display:grid;gap:0;background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.objs li{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px 20px;border-top:1px solid var(--line);font-size:var(--t-sm);line-height:1.5}
.objs li:first-child{border-top:0}
.objs .ico{color:var(--good);margin-top:2px}

/* Principles */
.principles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.principle{padding:26px 26px 28px 0;display:grid;gap:10px;align-content:start}
.principle + .principle{padding-left:26px;border-left:1px solid var(--line)}
.principle h3{font-size:1.125rem}
.principle p{color:var(--muted);font-size:var(--t-sm)}
.principle .mark{width:42px;height:4px;border-radius:4px;background:var(--c)}

/* Closing */
.closing{display:grid;gap:22px;max-width:820px;padding-bottom:24px}
.closing blockquote{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.35;letter-spacing:-.015em;padding-left:24px;position:relative;text-wrap:balance}
.closing blockquote::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:4px;background:var(--spectrum-v)}
.closing p{color:var(--muted);max-width:68ch}

/* Sessions */
.sess-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:56px;padding-top:36px}
.sess-layout > *{min-width:0}
.sess-index{position:sticky;top:calc(var(--bar-h) + 24px);align-self:start;max-height:calc(100vh - var(--bar-h) - 48px);overflow:auto}
.sess-index h2{font-size:var(--t-xs);font-family:var(--font-body);font-weight:700;color:var(--muted);letter-spacing:0;padding:0 12px 10px}
.sess-index ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sess-index a{display:grid;grid-template-columns:10px 1fr;gap:2px 12px;padding:10px 12px;border-radius:var(--r-sm);text-decoration:none;color:var(--ink);line-height:1.35;transition:background-color .15s}
.sess-index a:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.sess-index .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:6px;grid-row:span 2}
.sess-index small{color:var(--muted);font-size:var(--t-xs);font-weight:700}
.sess-index .ttl{font-size:var(--t-sm)}
.sess-index a[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--c),inset 0 0 0 1px var(--line)}
.sess{max-width:740px;min-width:0}
.sess-head{display:grid;gap:16px}
.sess-meta{display:flex;flex-wrap:wrap;gap:8px}
.sess-head h1{font-size:clamp(1.6rem,3vw,2.25rem)}
.panel{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);padding:22px 24px;position:relative;overflow:hidden}
.panel h2{font-size:var(--t-sm);margin-bottom:10px}
.objective{margin-top:26px}
.objective::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.objective ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.objective li{display:grid;grid-template-columns:auto 1fr;gap:12px;font-size:var(--t-sm);line-height:1.5}
.objective li::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c);margin-top:8px}
.tools{margin-top:22px}
.tools h2{font-size:var(--t-sm);margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.tags li{padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--t-xs);font-weight:700;line-height:1.35}
.sess-body{margin-top:12px;display:grid;gap:18px}
.sess-body h3{font-size:1.25rem;margin-top:30px;display:flex;align-items:center;gap:12px}
.sess-body h3::before{content:"";width:18px;height:4px;border-radius:4px;background:var(--c);flex:none}
.sess-body > p{max-width:68ch}
.blist{margin:0;padding:0;list-style:none;display:grid;gap:8px;max-width:68ch}
.blist li{display:grid;grid-template-columns:auto 1fr;gap:12px}
.blist li::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c);margin-top:10px}
.olist{margin:0;padding:0;list-style:none;display:grid;gap:0;counter-reset:o;background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.olist li{counter-increment:o;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 18px;border-top:1px solid var(--line);font-size:var(--t-sm);line-height:1.5}
.olist li:first-child{border-top:0}
.olist li::before{content:counter(o);font-family:var(--font-display);font-size:var(--t-xs);font-weight:500;color:var(--ink);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.olist strong{font-weight:700}

.prompt{margin:0;background:color-mix(in srgb,var(--c,var(--accent)) 7%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,var(--accent)) 30%,var(--line));border-radius:20px 20px 20px 6px;padding:14px 18px 18px}
.prompt figcaption{display:flex;align-items:center;gap:8px;font-size:var(--t-xs);font-weight:700;color:var(--muted);margin-bottom:8px;min-height:30px}
.prompt figcaption .ico{color:var(--c,var(--accent))}
.prompt p{white-space:pre-wrap;font-size:var(--t-base);line-height:1.55}

.compare{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}
.cmp{border-radius:var(--r);padding:14px 18px 16px;display:grid;gap:8px;align-content:start}
.cmp-label{display:flex;align-items:center;gap:8px;font-size:var(--t-xs);font-weight:700}
.cmp-bad{background:color-mix(in srgb,var(--bad) 6%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 28%,var(--line))}
.cmp-bad .cmp-label{color:var(--bad)}
.cmp-bad p{color:var(--muted)}
.cmp-good{background:color-mix(in srgb,var(--good) 6%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 30%,var(--line))}
.cmp-good .cmp-label{color:var(--good)}
.cmp p{font-size:var(--t-sm);line-height:1.55}

.checkset{background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.checkset-head{display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:700;font-size:var(--t-sm)}
.checkset-head .count{margin-left:auto;font-size:var(--t-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.checkset label{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:11px 18px;border-top:1px solid var(--line);cursor:pointer;font-size:var(--t-sm);line-height:1.5;transition:background-color .15s}
.checkset label:hover{background:var(--tint)}
.checkset input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--c,var(--accent));cursor:pointer}
.checkset input:checked + span{color:var(--muted)}

.key{position:relative;padding:18px 22px 20px 26px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:6px;overflow:hidden}
.key::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--spectrum-v)}
.key-label{font-family:var(--font-display);font-size:.75rem;font-weight:500;color:var(--muted)}
.key p{font-size:1.125rem;line-height:1.5}

.tutor-note{border-radius:var(--r);padding:16px 20px;background:var(--tint);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 30%,transparent);display:grid;gap:8px}
.tutor-note .tn-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:var(--t-sm)}
.tutor-note .tn-head span.v{font-family:var(--font-display);font-size:.75rem;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tutor-note p{font-size:var(--t-sm);line-height:1.55}

.dice{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.die{background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px;display:grid;gap:2px}
.die b{font-family:var(--font-display);font-weight:600;font-size:1.75rem;line-height:1;padding-bottom:8px;margin-bottom:6px;border-bottom:3px solid var(--c);justify-self:start}
.die span{font-weight:700;font-size:var(--t-sm)}
.die small{color:var(--muted);font-size:var(--t-xs)}

.bloom{background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:18px 20px;display:grid;gap:10px}
.bloom ol{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.bloom li{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;font-size:var(--t-sm)}
.bloom .b{height:14px;border-radius:7px;background:color-mix(in srgb,var(--c) var(--o),var(--surface));width:var(--w)}
.bloom li.dim{color:var(--muted)}
.bloom li.dim .b{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 10px);box-shadow:inset 0 0 0 1px var(--line)}
.cap{font-size:var(--t-xs);color:var(--muted)}

.cycle{display:grid;gap:10px}
.cycle ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cycle li{display:flex;align-items:center;gap:8px;font-size:var(--t-sm);font-weight:700}
.cycle li span{padding:7px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.cycle li:not(:last-child)::after{content:"";width:16px;height:2px;background:var(--c);border-radius:2px}
.cycle li:last-child span{background:color-mix(in srgb,var(--c) 16%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--c)}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;display:grid;gap:6px;align-content:start}
.steps li::before{content:counter(s);font-family:var(--font-display);font-size:var(--t-xs);font-weight:500;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.steps strong{font-size:var(--t-base)}
.steps p{font-size:var(--t-sm);color:var(--muted);line-height:1.5}

.voices{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.voices li{background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;display:grid;gap:6px;align-content:start}
.voices li:last-child{box-shadow:inset 0 0 0 2px var(--c)}
.voices strong{font-size:var(--t-base)}
.voices p{font-size:var(--t-sm);color:var(--muted);line-height:1.5}

.note{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 18px;border-radius:var(--r);background:color-mix(in srgb,var(--p6) 9%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--p6) 30%,var(--line));font-size:var(--t-sm);line-height:1.5}
.note .ico{color:var(--p6);margin-top:2px}
.goto{display:inline-flex;align-items:center;gap:8px;justify-self:start;font-weight:700;font-size:var(--t-sm);text-decoration:none;color:var(--accent);padding:6px 0;border-bottom:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.goto:hover{border-bottom-color:var(--accent)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{display:grid;gap:4px;padding:14px 18px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;color:var(--ink);transition:box-shadow .15s}
.pager a:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.pager a.next{text-align:right;grid-column:2}
.pager small{font-size:var(--t-xs);font-weight:700;color:var(--muted)}
.pager span{font-size:var(--t-sm);line-height:1.35}

/* Prompts library */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:28px 0 20px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:0;cursor:pointer;padding:7px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--t-xs);font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:8px;transition:box-shadow .15s,color .15s,background-color .15s}
.filters button[data-c]::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.filters button[aria-pressed="true"]{color:var(--ink);background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--c,var(--ink))}
.search{margin-left:auto;position:relative;min-width:260px}
.search input{width:100%;font:inherit;font-size:var(--t-sm);padding:10px 14px 10px 40px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.search input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.result-count{font-size:var(--t-xs);font-weight:700;color:var(--muted);margin-bottom:12px}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pcard{display:grid;gap:12px;align-content:start}
.pcard .prompt{height:100%}
.pcard-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pcard-meta a{font-size:var(--t-xs);font-weight:700;color:var(--muted);text-decoration:none;margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.pcard-meta a:hover{color:var(--accent)}
.empty{padding:28px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.formula{display:grid;gap:12px;background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);padding:20px 22px}
.formula h2{font-size:var(--t-sm)}
.formula ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.formula li{display:flex;align-items:center;gap:8px}
.formula li span{padding:7px 14px;border-radius:999px;font-size:var(--t-sm);font-weight:700;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.formula li.new span{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--spectrum) border-box;box-shadow:none;padding:5px 12px}
.formula li:not(:last-child)::after{content:"+";color:var(--muted);font-weight:700}
.formula .cap{display:flex;align-items:center;gap:8px}
.formula .cap::before{content:"";width:22px;height:12px;border-radius:999px;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--spectrum) border-box}

/* Tutor page */
.paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.path{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);padding:22px 24px;display:grid;gap:14px;align-content:start}
.path-head{display:flex;align-items:center;gap:12px}
.path-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;color:#fff;font-size:.95rem}
.path-head strong{display:block;font-size:var(--t-base);line-height:1.3}
.path-head span{font-size:var(--t-xs);color:var(--muted)}
.path dl{margin:0;display:grid;gap:12px}
.path dt{font-size:var(--t-xs);font-weight:700;color:var(--muted)}
.path dd{margin:2px 0 0;font-size:var(--t-sm);line-height:1.5}
.path a{font-size:var(--t-xs);font-weight:700}
.arch{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;counter-reset:a}
.arch li{counter-increment:a;background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px 16px 62px;position:relative;display:grid;gap:4px}
.arch li::before{content:counter(a);position:absolute;left:18px;top:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:var(--t-xs);font-weight:500;color:#fff;background:var(--c)}
.arch strong{font-size:var(--t-base)}
.arch p{font-size:var(--t-sm);color:var(--muted);line-height:1.5}
.template{background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.template-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.template-head strong{font-size:var(--t-sm)}
.template-head .copy{padding:8px 14px}
.template pre{margin:0;padding:20px 22px;max-height:520px;overflow:auto;font-family:var(--font-body);font-size:var(--t-sm);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.template pre .h{font-family:var(--font-display);font-weight:500;color:var(--accent)}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 18px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--t-sm);line-height:1.5}
.rules .ico{color:var(--accent);margin-top:2px}
.platforms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0}
.platforms div{background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;display:grid;gap:6px;align-content:start}
.platforms dt{font-weight:700;font-size:var(--t-base)}
.platforms dd{margin:0;font-size:var(--t-sm);color:var(--muted);line-height:1.5}

/* Assessment */
.wbar{display:flex;gap:4px;height:22px;margin-bottom:18px}
.wbar span{border-radius:6px;background:var(--c)}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.wcard{background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;display:grid;gap:6px;align-content:start;position:relative;overflow:hidden}
.wcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.wcard .pct{font-family:var(--font-display);font-size:1.75rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.wcard strong{font-size:var(--t-base);line-height:1.3}
.wcard p{font-size:var(--t-sm);color:var(--muted);line-height:1.5}
.selfcheck{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.dims{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:d}
.dim{counter-increment:d;background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;display:grid;gap:10px}
.dim-head{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.dim-head::before{content:counter(d);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:var(--t-xs);font-weight:500;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.dim-head strong{display:block;font-size:var(--t-base);line-height:1.35}
.dim-head p{font-size:var(--t-sm);color:var(--muted);line-height:1.5;margin-top:2px}
.levels{display:flex;flex-wrap:wrap;gap:6px;padding-left:42px;border:0;margin:0;min-width:0}
.levels label{position:relative;cursor:pointer}
.levels input{position:absolute;opacity:0;width:1px;height:1px}
.levels label span{display:inline-block;padding:6px 12px;border-radius:999px;font-size:var(--t-xs);font-weight:700;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);transition:background-color .15s,color .15s,box-shadow .15s}
.levels input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.levels input:checked + span{color:var(--ink)}
.levels label.l0 input:checked + span{background:color-mix(in srgb,var(--bad) 14%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--bad)}
.levels label.l1 input:checked + span{background:color-mix(in srgb,var(--p4) 18%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--p4)}
.levels label.l2 input:checked + span{background:color-mix(in srgb,var(--good) 14%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--good)}
.summary{position:sticky;top:calc(var(--bar-h) + 24px);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line);padding:20px 22px;display:grid;gap:14px}
.summary h3{font-size:var(--t-sm)}
.summary .big{font-family:var(--font-display);font-size:2rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.summary .big small{font-size:1rem;color:var(--muted)}
.pips{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.pips span{height:10px;border-radius:5px;background:var(--line)}
.pips span.l0{background:var(--bad)}.pips span.l1{background:var(--p4)}.pips span.l2{background:var(--good)}
.summary p{font-size:var(--t-sm);color:var(--muted);line-height:1.5}
.summary ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:var(--t-sm)}
.summary .btn{justify-self:start;padding:8px 14px;font-size:var(--t-xs)}
.qlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qlist li{background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:16px 18px;font-size:var(--t-sm);line-height:1.5}

/* References */
.refs{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:80ch}
.refs li{padding-left:22px;text-indent:-22px;font-size:var(--t-sm);line-height:1.6}
.refs a{word-break:break-word}
.srcs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.srcs a{display:grid;gap:2px;padding:14px 18px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;color:var(--ink);font-size:var(--t-sm);line-height:1.4}
.srcs a small{color:var(--muted);font-size:var(--t-xs);font-weight:700}
.srcs a:hover{box-shadow:inset 0 0 0 1px var(--accent)}

/* Footer */
.footer{margin-top:88px;border-top:1px solid var(--line);padding:28px 0 36px;position:relative}
.footer::before{content:"";position:absolute;left:0;top:-1px;width:160px;height:3px;background:var(--spectrum)}
.footer-inner{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-start;justify-content:space-between}
.footer p{font-size:var(--t-xs);color:var(--muted);max-width:70ch;line-height:1.6}
.footer nav{display:flex;flex-wrap:wrap;gap:6px 16px}
.footer nav a{font-size:var(--t-xs);font-weight:700;color:var(--muted);text-decoration:none}
.footer nav a:hover{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:var(--t-sm);font-weight:700;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){.toast{bottom:calc(88px + env(safe-area-inset-bottom))}}

::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}

/* Responsive */
@media (max-width:1060px){
  .hero-grid{grid-template-columns:1fr;gap:36px}
  .chat{max-width:620px}
  .two{grid-template-columns:1fr;gap:36px}

pt:`# Identidade
És o Tutor de Design Imersivo da UC CAARE. Acompanhas um grupo de futuros professores do 1.º e 2.º CEB que desenha um ambiente imersivo de aprendizagem (RV, RA ou 360°) através de Design Thinking. Escreves em português de Portugal.

# Postura
- O teu papel não é desenhar o recurso pelo estudante. É ajudá-lo a desenhá-lo melhor.
- Antes de sugerires, pergunta. Antes de corrigires, pede uma justificação.
- Não constróis cenas completas, não escreves código completo, não escreves os textos finais do recurso.
- Não atribuis classificações nem notas.
- Respostas curtas, salvo pedido explícito. Terminas sempre com uma pergunta.

# Início de cada conversa
Pergunta: 1) em que fase do Design Thinking está o grupo; 2) o que traz (ideia, documento, imagem); 3) de que precisa agora.

# Comportamento por fase
## Empatizar
- Pede evidências: «Como sabes isso?». Separa factos observados de suposições.
- Assinala estereótipos. Nunca inventas características dos alunos.
## Definir
- Verifica se o ponto de vista esconde uma solução.
- Situa cada objetivo na taxonomia de Bloom revista e verifica se o verbo é observável.
- Pergunta sempre: «O que permite esta experiência imersiva que a sala de aula não permite?» (critério DICE: perigoso, impossível, contraproducente, caro).
## Idear
- Só intervéns depois de o grupo apresentar as suas ideias.
- Alargas com variações «E se…?». Nunca escolhes pelo grupo.
## Prototipar
- Perguntas o que o aluno faz antes, durante e depois da imersão.
- Em problemas técnicos (Delightex Edu, FrameVR, ClassVR), perguntas o que já foi tentado e dás uma pista, não a solução.
- Verificas acessibilidade: texto legível nos óculos, alternativa ao áudio, teletransporte, tempo de imersão definido, alternativa sem óculos.
## Testar
- Ajudas a preparar guiões e indicadores de observação.
- Ajudas a organizar resultados por problema e gravidade. A priorização é do grupo.

# Feedback
Quando te pedirem feedback, usas a rubrica abaixo. Para cada dimensão: 1. evidências encontradas; 2. o que está consolidado; 3. o que rever; 4. uma pergunta. Sem classificação.

# Rubrica da UC (resumo)
1. Alinhamento curricular e objetivos observáveis
2. Valor acrescentado da imersão (DICE)
3. Agência do aluno
4. Carga cognitiva e clareza
5. Conforto e segurança
6. Inclusão (DUA, alternativa sem óculos)
7. Integração na aula (antes, durante, depois)
8. Exequibilidade técnica

# Base de conhecimento
Usas prioritariamente: Aprendizagens Essenciais de [área e ano], Perfil dos Alunos, DL 54/2018, DL 55/2018, a rubrica da UC e os guias das plataformas. Indicas o documento em que te baseias. Se os documentos não forem suficientes, dizes que não são. Nunca inventas referências.

# Salvaguardas
- Se receberes nomes, fotografias ou dados identificáveis de crianças, não os usas e pedes que sejam retirados.
- Se não tens a certeza, dizes que não tens.
- Questões de avaliação, conflitos no grupo ou dilemas éticos: remetes para o docente.
- Se te pedirem para fazer o trabalho, recusas com simpatia e devolves uma pergunta.`,
en:`# Identity
You are the Immersive Design Tutor for the CAARE course unit. You support a group of pre-service teachers for the 1st and 2nd cycles of basic education who are designing an immersive learning environment (VR, AR or 360°) through Design Thinking. You reply in the language the student writes in.

# Stance
- Your role is not to design the resource for the student. It is to help them design it better.
- Before suggesting, ask. Before correcting, ask for a justification.
- You do not build complete scenes, write complete code or write the final texts of the resource.
- You do not give grades or marks.
- Keep answers short unless explicitly asked. Always end with a question.

# Start of every conversation
Ask: 1) which Design Thinking phase the group is in; 2) what they bring (idea, document, image); 3) what they need now.

# Behaviour by phase
## Empathise
- Ask for evidence: “How do you know that?”. Separate observed facts from assumptions.
- Flag stereotypes. Never invent characteristics of the pupils.
## Define
- Check whether the point of view hides a solution.
- Place each objective on the revised Bloom’s taxonomy and check that the verb is observable.
- Always ask: “What does this immersive experience allow that the classroom does not?” (DICE criterion: dangerous, impossible, counterproductive, expensive).
## Ideate
- Only step in after the group has presented its own ideas.
- Widen the range with “What if…?” variations. Never choose for the group.
## Prototype
- Ask what the pupil does before, during and after immersion.
- For technical problems (Delightex Edu, FrameVR, ClassVR), ask what has been tried and give a hint, not the solution.
- Check accessibility: text legible in the headset, an alternative to audio, teleport movement, a set immersion time, an alternative without headsets.
## Test
- Help prepare test scripts and observation indicators.
- Help sort results by problem and severity. Prioritisation belongs to the group.

# Feedback
When asked for feedback, use the rubric below. For each dimension: 1. evidence found; 2. what is secure; 3. what to revise; 4. one question. No grade.

# Course unit rubric (summary)
1. Curriculum alignment and observable objectives
2. Added value of immersion (DICE)
3. Pupil agency
4. Cognitive load and clarity
5. Comfort and safety
6. Inclusion (UDL, alternative without headsets)
7. Lesson integration (before, during, after)
8. Technical feasibility

# Knowledge base
Draw first on: Aprendizagens Essenciais for [subject and year], the Students’ Profile at the End of Compulsory Schooling, Decree-Law 54/2018, Decree-Law 55/2018, the course rubric and the platform guides. State the document you rely on. If the documents are not enough, say so. Never invent references.

# Safeguards
- If you receive names, photos or identifiable data about children, do not use them and ask for them to be removed.
- If you are not sure, say so.
- Questions about grading, group conflicts or ethical dilemmas: refer them to the lecturer.
- If asked to do the work, decline kindly and hand back a question.`

    case "voices": return `<ul class="voices">${b[1].map(x => `<li><strong>${esc(x[0])}</strong><p>${esc(x[1])}</p></li>`).join("")}</ul>`;
    case "note": return `<p class="note">${I.shield}<span>${esc(b[1])}</span></p>`;
    case "goto": return `<a class="goto" href="#${b[1]}">${esc(b[2])}${I.arrow}</a>`;
    default: return "";
  }
}
function formulaHTML(withHeading){
  const F = L(FORMULA);
  return `<div class="formula">${withHeading ? `<h2>${esc(t("formulaTitle"))}</h2>` : ""}<ol>${F.map(x => `<li class="${x[1] ? "new" : ""}"><span>${esc(x[0])}</span></li>`).join("")}</ol><p class="cap">${esc(t("formulaNew"))}</p></div>`;
}
function viewSession(id){
  const idx = SESSIONS.findIndex(s => s.id === id);
  const s = SESSIONS[idx], d = L(s), p = ph(s.phase);
  const prev = SESSIONS[idx - 1], next = SESSIONS[idx + 1];
  const objs = d.objective.replace(/\.$/, "").split("; ");
  return `<div class="wrap sess-layout">
    <nav class="sess-index" aria-label="${esc(t("sessionsIndex"))}"><h2>${esc(t("sessionsIndex"))}</h2><ol>${SESSIONS.map(x => `<li><a href="#${x.id}" style="--c:${cv(x.phase)}"${x.id === id ? ' aria-current="page"' : ""}><span class="dot" aria-hidden="true"></span><small>${esc(L(x).short)}</small><span class="ttl">${esc(L(x).title)}</span></a></li>`).join("")}</ol></nav>
    <article class="sess" style="--c:${cv(s.phase)}">
      <header class="sess-head">
        <div class="sess-meta"><span class="chip">${esc(L(p))}</span><span class="pill">${esc(d.label)}</span><span class="pill">${s.hours} ${esc(t("hours"))}</span></div>
        <h1 tabindex="-1">${esc(d.title)}</h1>
      </header>
      <section class="panel objective"><h2>${esc(t("objective"))}</h2><ul>${objs.map(o => `<li><span>${esc(o.charAt(0).toUpperCase() + o.slice(1))}.</span></li>`).join("")}</ul></section>
      <section class="tools"><h2>${esc(t("tools"))}</h2><ul class="tags">${d.tools.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>
      <div class="sess-body">${d.body.map((b,i) => blockHTML(b, s.id, i)).join("")}</div>
      <nav class="pager" aria-label="${esc(t("prev") + " / " + t("next"))}">
        ${prev ? `<a class="prev" href="#${prev.id}"><small>${esc(t("prev"))}: ${esc(L(prev).short)}</small><span>${esc(L(prev).title)}</span></a>` : ""}
        ${next ? `<a class="next" href="#${next.id}"><small>${esc(t("next"))}: ${esc(L(next).short)}</small><span>${esc(L(next).title)}</span></a>` : ""}
      </nav>
    </article>
  </div>`;
}

/* ---------- Prompts library ---------- */
function allPrompts(){
  const out = [];
  SESSIONS.forEach(s => {
    L(s).body.forEach(b => {
      if(b[0] === "prompt") out.push({sid:s.id, phase:s.phase, label:b[1] || t("promptLabel"), text:b[2]});
      if(b[0] === "compare") out.push({sid:s.id, phase:s.phase, label:b[3], text:b[4]});
    });
  });
  return out;
}
function viewPrompts(){
  const phasesWith = PHASES.filter(p => allPrompts().some(x => x.phase === p.id));
  return `<div class="wrap">
    <header class="page-head"><h1 tabindex="-1">${esc(t("promptsTitle"))}</h1><p>${esc(t("promptsLead"))}</p></header>
    <div style="margin-top:28px">${formulaHTML(true)}</div>
    <div class="toolbar">
      <div class="filters" role="group" aria-label="${esc(t("colPhase"))}">
        <button type="button" data-filter="all" aria-pressed="${state.filter === "all"}">${esc(t("all"))}</button>
        ${phasesWith.map(p => `<button type="button" data-filter="${p.id}" data-c style="--c:var(${p.c})" aria-pressed="${state.filter === p.id}">${esc(L(p))}</button>`).join("")}
      </div>
      <label class="search" for="psearch"><span class="visually-hidden">${esc(t("search"))}</span>${I.search}<input type="search" id="psearch" placeholder="${esc(t("search"))}" value="${esc(state.query)}" autocomplete="off"></label>
    </div>
    <div id="plist-wrap"></div>
  </div>`;
}
function renderPromptList(){
  const wrap = document.getElementById("plist-wrap");
  if(!wrap) return;
  const q = state.query.trim().toLowerCase();
  const items = allPrompts().filter(x => (state.filter === "all" || x.phase === state.filter) && (!q || (x.text + " " + x.label).toLowerCase().includes(q)));
  const count = items.length === 1 ? t("countOne") : t("countMany").replace("{n}", items.length);
  wrap.innerHTML = `<p class="result-count" aria-live="polite">${esc(count)}</p>` + (items.length ? `<div class="plist">${items.map(x => { const s = SESSIONS.find(y => y.id === x.sid); return `<div class="pcard" style="--c:${cv(x.phase)}"><div class="pcard-meta"><span class="chip">${esc(L(ph(x.phase)))}</span><span class="pill">${esc(L(s).short)}</span><a href="#${x.sid}">${esc(t("openSession"))}${I.arrow}</a></div>${promptHTML(x.label, x.text)}</div>`; }).join("")}</div>` : `<p class="empty">${esc(t("empty"))}</p>`);
}

/* ---------- Tutor page ---------- */
function templateHTML(){
  const txt = L(TEMPLATE);
  const html = txt.split("\n").map(line => /^#{1,2} /.test(line) ? `<span class="h">${esc(line)}</span>` : esc(line)).join("\n");
  return `<div class="template"><div class="template-head">${I.tutor}<strong>${esc(t("templateFile"))}</strong>${copyBtn(txt, t("copyTemplate"))}</div><pre tabindex="0">${html}</pre></div>`;
}
function viewTutor(){
  const arch = state.lang === "pt" ? ARCH_PT : ARCH_EN;
  const archColors = ["--p1","--p2","--p3","--p4","--p5","--p6","--p7"];
  const limits = state.lang === "pt" ? LIMITS_PT : LIMITS_EN;
  return `<div class="wrap">
    <header class="page-head"><h1 tabindex="-1">${esc(t("tutorTitle"))}</h1><p>${esc(t("tutorLead"))}</p></header>
    <section class="block" style="padding-top:44px" aria-labelledby="paths-h">
      <div class="block-head"><h2 id="paths-h">${esc(t("pathsTitle"))}</h2><p class="lead">${esc(t("pathsLead"))}</p></div>
      <div class="paths">${PATHS.map(p => `<article class="path"><div class="path-head"><span class="path-mark" style="background:${p.grad}" aria-hidden="true">${p.mark}</span><div><strong>${esc(p.name)}</strong><span>${esc(L(p.sub))}</span></div></div>
        <dl>${L(p.rows).map(r => `<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl>
        <div style="display:flex;flex-wrap:wrap;gap:6px 16px">${p.links.map(l => `<a href="${l.href}" target="_blank" rel="noopener">${esc(L(l))}</a>`).join("")}</div></article>`).join("")}</div>
      <p class="note" style="margin-top:14px">${I.info}<span>${esc(t("openQ"))}</span></p>
    </section>
    <section class="block" aria-labelledby="arch-h">
      <div class="block-head"><h2 id="arch-h">${esc(t("archTitle"))}</h2><p class="lead">${esc(t("archLead"))}</p></div>
      <ol class="arch">${arch.map((a,i) => `<li style="--c:var(${archColors[i]})"><strong>${esc(a[0])}</strong><p>${esc(a[1])}</p></li>`).join("")}</ol>
    </section>
    <section class="block" aria-labelledby="tpl-h">
      <div class="block-head"><h2 id="tpl-h">${esc(t("templateTitle"))}</h2><p class="lead">${esc(t("templateLead"))}</p></div>
      ${templateHTML()}
    </section>
    <section class="block" aria-labelledby="lim-h" style="--c:var(--p4)">
      <div class="block-head"><h2 id="lim-h">${esc(t("limitsTitle"))}</h2><p class="lead">${esc(t("limitsLead"))}</p></div>
      ${blockHTML(["check", t("limitsTitle"), limits], "tutorpage", 0)}
    </section>
    <section class="block" aria-labelledby="rules-h">
      <div class="block-head"><h2 id="rules-h">${esc(t("rulesTitle"))}</h2></div>
      <ul class="rules">${L(RULES).map(r => `<li>${I.shield}<span>${esc(r)}</span></li>`).join("")}</ul>
    </section>
    <section class="block" aria-labelledby="plat-h">
      <div class="block-head"><h2 id="plat-h">${esc(t("platformsTitle"))}</h2></div>
      <dl class="platforms">${L(PLATFORMS).map(p => `<div><dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd></div>`).join("")}</dl>
    </section>
  </div>`;
}

/* ---------- Assessment ---------- */
function summaryHTML(){
  const D = L(DIMS);
  const vals = D.map((_,i) => state.self[i]);
  const rated = vals.filter(v => v !== undefined).length;
  const secure = vals.filter(v => v === 2).length;
  const review = D.map((d,i) => ({d, v:vals[i]})).filter(x => x.v === 0 || x.v === 1).sort((a,b) => a.v - b.v);
  let body;
  if(rated === 0) body = `<p>${esc(t("sumNone"))}</p>`;
  else if(review.length === 0 && rated === 8) body = `<p>${esc(t("sumDone"))}</p>`;
  else if(review.length) body = `<p>${esc(t("sumReview"))}</p><ul>${review.slice(0,3).map(x => `<li>${esc(x.d[0])}</li>`).join("")}</ul>`;
  else body = `<p>${esc(t("sumNone"))}</p>`;
  return `<h3>${esc(t("sumTitle"))}</h3><div class="big">${secure}<small> ${esc(t("sumOf"))}</small></div>
    <div class="pips" aria-hidden="true">${vals.map(v => `<span class="${v === undefined ? "" : "l" + v}"></span>`).join("")}</div>
    ${body}<p style="font-size:var(--t-xs)">${esc(t("sumNote"))}</p>${rated ? `<button type="button" class="btn btn-ghost" data-reset>${esc(t("sumReset"))}</button>` : ""}`;
}
function viewAssessment(){
  const D = L(DIMS), lv = t("levels");
  return `<div class="wrap">
    <header class="page-head"><h1 tabindex="-1">${esc(t("assessTitle"))}</h1><p>${esc(t("assessLead"))}</p></header>
    <section class="block" style="padding-top:44px" aria-labelledby="w-h">
      <div class="block-head"><h2 id="w-h">${esc(t("weightsTitle"))}</h2></div>
      <div class="wbar" role="img" aria-label="${esc(WEIGHTS.map(w => L(w)[0] + " " + w.pct + "%").join(", "))}">${WEIGHTS.map(w => `<span style="flex:${w.pct};--c:var(${w.c})"></span>`).join("")}</div>
      <div class="wgrid">${WEIGHTS.map(w => `<div class="wcard" style="--c:var(${w.c})"><span class="pct">${w.pct}%</span><strong>${esc(L(w)[0])}</strong><p>${esc(L(w)[1])}</p></div>`).join("")}</div>
      <p class="note" style="margin-top:14px">${I.info}<span>${esc(t("tutorNotAssessed"))}</span></p>
    </section>
    <section class="block" aria-labelledby="r-h">
      <div class="block-head"><h2 id="r-h">${esc(t("rubricTitle"))}</h2><p class="lead">${esc(t("rubricLead"))}</p></div>
      <div class="selfcheck">
        <ol class="dims">${D.map((d,i) => `<li class="dim"><div class="dim-head"><div><strong id="dim-${i}">${esc(d[0])}</strong><p>${esc(d[1])}</p></div></div>
          <fieldset class="levels" aria-labelledby="dim-${i}">${lv.map((l,j) => `<label class="l${j}" for="lv-${i}-${j}"><input type="radio" name="lv-${i}" id="lv-${i}-${j}" value="${j}" data-self="${i}"${state.self[i] === j ? " checked" : ""}><span>${esc(l)}</span></label>`).join("")}</fieldset></li>`).join("")}</ol>
        <aside class="summary" id="summary" aria-live="polite">${summaryHTML()}</aside>
      </div>
    </section>
    <section class="block" aria-labelledby="rf-h">
      <div class="block-head"><h2 id="rf-h">${esc(t("reflTitle"))}</h2><p class="lead">${esc(t("reflLead"))}</p></div>
      <ul class="qlist">${L(REFLECT).map(q => `<li>${esc(q)}</li>`).join("")}</ul>
    </section>
  </div>`;
}

/* ---------- References ---------- */
function viewReferences(){
  const R = L(REFS);
  const list = REFS.common.map(r => r.charAt(0) === "@" ? esc(R[r.slice(1)]) : r);
  return `<div class="wrap">
    <header class="page-head"><h1 tabindex="-1">${esc(t("refsTitle"))}</h1><p>${esc(t("refsLead"))}</p></header>
    <section class="block" style="padding-top:36px"><ul class="refs">${list.map(r => `<li>${r}</li>`).join("")}</ul></section>
    <section class="block" aria-labelledby="src-h">
      <div class="block-head"><h2 id="src-h">${esc(t("toolSources"))}</h2></div>
      <ul class="srcs">${SOURCES.map(s => `<li><a href="${s.href}" target="_blank" rel="noopener"><small>${esc(s.by)}</small><span>${esc(L(s))}</span></a></li>`).join("")}</ul>
    </section>
  </div>`;
}

/* ---------- Render ---------- */
function render(){
  copyReg = [];
  renderChrome();
  const r = state.route;
  const main = document.getElementById("main");
  let html;
  if(r === "overview") html = viewOverview();
  else if(r === "prompts") html = viewPrompts();
  else if(r === "tutor") html = viewTutor();
  else if(r === "assessment") html = viewAssessment();
  else if(r === "references") html = viewReferences();
  else html = viewSession(r === "sessions" ? "s1-2" : r);
  main.innerHTML = html;
  if(r === "prompts") renderPromptList();
  const cur = main.querySelector('.sess-index a[aria-current="page"]');
  if(cur && window.matchMedia("(max-width:1060px)").matches){
    const ol = cur.closest("ol");
    if(ol) ol.scrollLeft = cur.offsetLeft - 20;
  }
}
function go(fromNav){
  const r = currentRoute();
  const apply = () => {
    state.route = r;
    render();
    if(fromNav){
      window.scrollTo(0, 0);
      const h1 = document.querySelector("#main h1");
      if(h1) h1.focus({preventScroll:true});
    }
  };
  if(fromNav && document.startViewTransition && !reduced){ document.startViewTransition(apply); }
  else apply();
}

/* ---------- Interactions ---------- */
let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}
async function copyText(text, btn){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }
  catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0"; ta.style.top = "0";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
    }catch(e2){ ok = false; }
  }
  toast(ok ? t("copied") : t("copyFail"));
  if(ok && btn){
    const span = btn.querySelector("span");
    const prev = span ? span.textContent : "";
    btn.classList.add("done");
    if(span) span.textContent = t("copied");
    setTimeout(() => { btn.classList.remove("done"); if(span) span.textContent = prev; }, 1600);
  }
}
document.addEventListener("click", e => {
  const langBtn = e.target.closest("[data-lang]");
  if(langBtn){
    if(langBtn.dataset.lang !== state.lang){
      state.lang = langBtn.dataset.lang;
      store.set("caare-lang", state.lang);
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
    }
    return;
  }
  const cp = e.target.closest("[data-copy]");
  if(cp){ copyText(copyReg[Number(cp.dataset.copy)], cp); return; }
  if(e.target.closest("[data-chat-next]")){
    state.chat = (state.chat + 1) % CHATS.length;
    const old = document.getElementById("chat");
    if(old){ old.outerHTML = chatHTML(!reduced); }
    const nb = document.querySelector("[data-chat-next]");
    if(nb) nb.focus({preventScroll:true});
    return;
  }
  const f = e.target.closest("[data-filter]");
  if(f){
    state.filter = f.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === state.filter)));
    renderPromptList();
    return;
  }
  if(e.target.closest("[data-reset]")){
    state.self = {};
    document.querySelectorAll("[data-self]").forEach(r => { r.checked = false; });
    document.getElementById("summary").innerHTML = summaryHTML();
  }
});
document.addEventListener("change", e => {
  const c = e.target.closest("[data-check]");
  if(c){
    state.checks[c.dataset.check] = c.checked;
    const g = c.dataset.group, total = Number(c.dataset.total);
    let n = 0;
    for(let j = 0; j < total; j++){ if(state.checks[g + "-" + j]) n++; }
    const el = document.querySelector(`[data-count="${g}"]`);
    if(el) el.textContent = n + "/" + total + " " + t("checked");
    return;
  }
  const s = e.target.closest("[data-self]");
  if(s){
    state.self[Number(s.dataset.self)] = Number(s.value);
    document.getElementById("summary").innerHTML = summaryHTML();
  }
});
document.addEventListener("input", e => {
  if(e.target.id === "psearch"){ state.query = e.target.value; renderPromptList(); }
});
window.addEventListener("hashchange", () => go(true));

go(false);
})();
</script>
